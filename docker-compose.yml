
services:
  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  backend:
    build:
      context: ./Lumina_Backend
      dockerfile: Dockerfile
    container_name: backend_service
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CACHE_TTL_OVERRIDE: ${CACHE_TTL_OVERRIDE:-}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network


  notificacoes-db:
    image: mysql:8.0
    container_name: notificacoes-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIF_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOTIF_DB_NAME}
    volumes:
      - notificacoes_db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3307:3306"

  notificacoes:
    build:
      context: ./Lumina_Microsservico/notificacoes
      dockerfile: Dockerfile
    container_name: notificacoes_service
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      DB_HOST: notificacoes-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${NOTIF_DB_ROOT_PASSWORD}
      DB_NAME: ${NOTIF_DB_NAME}
    depends_on:
      notificacoes-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./Lumina_Frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    expose:
      - "80"
      - "443"
    depends_on:
      - database
      - backend
    networks:
      - app-network

volumes:
  mysql-data:
  uploads_data:
  notificacoes_db_data:

networks:
  app-network:
    driver: bridge
