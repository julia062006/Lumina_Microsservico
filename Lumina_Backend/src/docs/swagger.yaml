  /colecoes/{id}:
    parameters:
      - $ref: '#/components/parameters/ColecaoId'
    get:
      tags: [Coleções]
      summary: Consulta uma coleção
      responses:
        '200':
          description: Coleção encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Colecao'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Coleções]
      summary: Atualiza uma coleção
      description: Requer JWT e perfil admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColecaoUpdateRequest'
      responses:
        '200':
          description: Coleção atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                mensagem: Coleção atualizada com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Coleções]
      summary: Remove uma coleção
      description: Requer JWT e perfil admin.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Coleção removida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                mensagem: Coleção removida com sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      description: id_usuario numérico
      schema:
        type: integer
    LivroId:
      name: id
      in: path
      required: true
      description: id_livro numérico
      schema:
        type: integer
    AutorId:
      name: id
      in: path
      required: true
      description: id_autor numérico
      schema:
        type: integer
    CategoriaId:
      name: id
      in: path
      required: true
      description: id_categoria numérico
      schema:
        type: integer
    EditoraId:
      name: id
      in: path
      required: true
      description: id_editora numérico
      schema:
        type: integer
    ColecaoId:
      name: id
      in: path
      required: true
      description: id_colecao numérico
      schema:
        type: integer
  responses:
    BadRequest:
      description: Requisição inválida, validação ou falha no upload
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorMessage'
              - $ref: '#/components/schemas/LegacyError'
              - $ref: '#/components/schemas/ValidationErrors'
    Unauthorized:
      description: Token ausente ou usuário não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Forbidden:
      description: Token inválido ou usuário sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
  schemas:
    ErrorMessage:
      type: object
      properties:
        mensagem:
          type: string
      required: [mensagem]
      example:
        mensagem: Erro interno do servidor
    ErrorWithDetails:
      type: object
      properties:
        mensagem:
          type: string
        erro:
          type: object
          additionalProperties: true
      required: [mensagem, erro]
    LegacyError:
      type: object
      properties:
        erro:
          type: string
      required: [erro]
      example:
        erro: Arquivo não encontrado
    ValidationErrors:
      type: object
      description: Erros retornados diretamente por express-validator.
      properties:
        erros:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [erros]
    MessageResponse:
      type: object
      properties:
        mensagem:
          type: string
      required: [mensagem]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
      required: [email, senha]
    LoginResponse:
      type: object
      properties:
        mensagem:
          type: string
        token:
          type: string
          description: JWT assinado pelo backend
        usuario:
          $ref: '#/components/schemas/UsuarioLogin'
      required: [mensagem, token, usuario]
    UsuarioLogin:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        role:
          type: string
        foto_perfil:
          type: string
          nullable: true
      required: [id, nome, email, cpf, role, foto_perfil]
    UsuarioCreateRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
          description: Deve conter uma letra maiúscula e um caractere especial.
        confirmarSenha:
          type: string
          format: password
          description: Deve ser igual a senha.
        cpf:
          type: string
          description: CPF válido; o backend remove caracteres de formatação.
        foto_perfil:
          type: string
          format: binary
          description: Arquivo opcional. O limite Multer é 10 MiB.
      required: [nome, email, senha, confirmarSenha, cpf]
    UsuarioCreateResponse:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        role:
          type: string
        foto_perfil:
          type: string
          nullable: true
      required: [id, nome, email, cpf, role, foto_perfil]
    UsuarioUpdateRequest:
      type: object
      properties:
        nome:
          type: string
          description: Opcional, mas não pode ser vazio quando informado.
        senha:
          type: string
          format: password
          minLength: 6
          description: Deve conter uma letra maiúscula e um caractere especial.
        cpf:
          type: string
          description: CPF válido; o backend remove caracteres de formatação.
        foto_perfil:
          type: string
          format: binary
          description: Arquivo opcional. O limite Multer é 10 MiB.
    UsuarioUpdateResponse:
      type: object
      properties:
        mensagem:
          type: string
        id_usuario:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        role:
          type: string
        foto_perfil:
          type: string
          nullable: true
      required: [mensagem, id_usuario, nome, email, cpf, role, foto_perfil]
    UsuarioProfile:
      type: object
      properties:
        id_usuario:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        role:
          type: string
        foto_perfil:
          type: string
          nullable: true
      required: [id_usuario, nome, email, cpf, role, foto_perfil]
    UsuarioAdmin:
      type: object
      description: >-
        Campos não sensíveis retornados para administração. A resposta Sequelize
        atual também pode conter a senha armazenada (hash); ela foi omitida desta
        documentação por ser informação sensível.
      properties:
        id_usuario:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        id_role:
          type: integer
        foto_perfil:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id_usuario, nome, email, cpf, id_role, foto_perfil, role]
    Role:
      type: object
      properties:
        id_role:
          type: integer
        nome:
          type: string
      required: [id_role, nome]
    Destinatario:
      type: object
      properties:
        id_usuario:
          type: integer
        email:
          type: string
          format: email
      required: [id_usuario, email]

    Livro:
      type: object
      properties:
        id_livro:
          type: integer
        id_autor:
          type: integer
        titulo:
          type: string
        descricao:
          type: string
        capa_imagem:
          type: string
          description: Nome do arquivo gerado no upload.
        arquivo_pdf:
          type: string
          description: Nome do arquivo gerado no upload.
        id_categoria:
          type: integer
        id_editora:
          type: integer
        id_colecao:
          type: integer
          nullable: true
        destaque:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id_livro
        - id_autor
        - titulo
        - descricao
        - capa_imagem
        - arquivo_pdf
        - id_categoria
        - id_editora
        - id_colecao
        - destaque
    LivroCreateRequest:
      type: object
      properties:
        id_autor:
          type: string
          description: ID numérico do autor, enviado como campo de formulário.
        titulo:
          type: string
        descricao:
          type: string
        id_categoria:
          type: string
          description: ID numérico da categoria, enviado como campo de formulário.
        id_editora:
          type: string
          description: ID numérico da editora, enviado como campo de formulário.
        id_colecao:
          type: string
          nullable: true
          description: ID numérico opcional; vazio ou ausente grava null.
        destaque:
          type: string
          enum: ['true', 'false']
          description: Somente a string true grava destaque true.
        capa_imagem:
          type: string
          format: binary
          description: Imagem obrigatória JPEG, JPG, PNG ou WEBP; máximo 10 MiB.
        arquivo_pdf:
          type: string
          format: binary
          description: PDF obrigatório; máximo 10 MiB.
      required:
        - id_autor
        - titulo
        - descricao
        - id_categoria
        - id_editora
        - capa_imagem
        - arquivo_pdf
    LivroUpdateRequest:
      type: object
      properties:
        id_autor:
          type: string
        titulo:
          type: string
        descricao:
          type: string
        id_categoria:
          type: string
        id_editora:
          type: string
        id_colecao:
          type: string
          nullable: true
        destaque:
          type: string
          enum: ['true', 'false']
        capa_imagem:
          type: string
          format: binary
          description: Imagem opcional JPEG, JPG, PNG ou WEBP; máximo 10 MiB.
        arquivo_pdf:
          type: string
          format: binary
          description: PDF opcional; máximo 10 MiB.
    LivroComAssociacoes:
      allOf:
        - $ref: '#/components/schemas/Livro'
        - type: object
          properties:
            autor:
              $ref: '#/components/schemas/Autor'
            categoria:
              $ref: '#/components/schemas/Categoria'
            editora:
              $ref: '#/components/schemas/Editora'
            colecao:
              allOf:
                - $ref: '#/components/schemas/Colecao'
              type: object
              nullable: true
    LivroAutorCategoria:
      allOf:
        - $ref: '#/components/schemas/Livro'
        - type: object
          properties:
            autor:
              $ref: '#/components/schemas/Autor'
            categoria:
              $ref: '#/components/schemas/Categoria'

    Autor:
      type: object
      properties:
        id_autor:
          type: integer
        nome:
          type: string
        biografia:
          type: string
        foto:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id_autor, nome, biografia, foto]
    AutorCreateRequest:
      type: object
      properties:
        nome:
          type: string
        biografia:
          type: string
        foto:
          type: string
          format: binary
          description: O controller não exige arquivo, mas o model não aceita foto nula. Limite de 10 MiB.
      required: [nome, biografia, foto]
    AutorUpdateRequest:
      type: object
      properties:
        nome:
          type: string
        biografia:
          type: string
        foto:
          type: string
          format: binary
          description: Foto opcional; se omitida, mantém a atual. Limite de 10 MiB.

    Categoria:
      type: object
      properties:
        id_categoria:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        destaque:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id_categoria, nome, descricao, destaque]
    CategoriaCreateRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        destaque:
          type: boolean
          default: false
      required: [nome, descricao]
    CategoriaUpdateRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        destaque:
          type: boolean

    Editora:
      type: object
      properties:
        id_editora:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id_editora, nome, descricao]
    EditoraWriteRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
      required: [nome, descricao]
    EditoraUpdateRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string

    Colecao:
      type: object
      properties:
        id_colecao:
          type: integer
        nome:
          type: string
        descricao:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id_colecao, nome, descricao]
    ColecaoWriteRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
      required: [nome, descricao]
    ColecaoUpdateRequest:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
