events {}

http {
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        client_max_body_size 50M;

        ssl_certificate /etc/nginx/certs/lumina.local.pem;
        ssl_certificate_key /etc/nginx/certs/lumina.local-key.pem;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; img-src 'self' data: blob:";

        location / {
            proxy_pass http://frontend_service:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        location = /index.html {
            proxy_pass http://frontend_service:80/index.html;
        }

        location /api/ {
            proxy_pass http://backend_service:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/uploads/ {
        proxy_pass http://backend_service:3000/uploads/;
        proxy_set_header Host $host;
        }
    }
}